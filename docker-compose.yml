services:
  app:
    build: .
    image: drive-to-text:local
    ports:
      # Loopback only: the API has no authentication, so it is not published to the network.
      - "127.0.0.1:${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 8000
    restart: unless-stopped
