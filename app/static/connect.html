<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect Google Drive · Drive to Text</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/theme.js"></script>
  <script defer src="/static/connect.js"></script>
</head>
<body>
<main class="flow"><section class="stage-inner">
  <a class="stage-link" href="/">Back to Drive to Text</a>
  <h1 class="stage-title">Connect private Drive</h1>
  <p class="stage-sub">Choose individual documents, or grant read access to scan a folder and its subfolders.</p>
  <button class="button button-primary" id="files" type="button" hidden>Choose private files</button>
  <button class="button button-ghost" id="folder" type="button" disabled>Connect a private folder</button>
  <p class="field-hint" id="message" role="status">Loading Google sign-in…</p>
</section></main>
</body>
</html>
